name: source-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Build with CI-only placeholder auth config
        env:
          NEON_AUTH_BASE_URL: https://example.invalid/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-build-placeholder-not-a-production-secret-0123456789
        run: npm run build
